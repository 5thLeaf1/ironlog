<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IronLog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F6F6F8; --surface:#FFFFFF; --surface-2:#F0F0F3; --border:#E2E2E7;
    --text:#15161B; --text-muted:#6B6F7A; --text-faint:#9A9EA8;
    --accent:#D8460D; --accent-ink:#FFFFFF; --accent-soft:#FBE4D6;
    --success:#187A4C; --success-soft:#DCF3E6;
    --danger:#C22A22; --danger-soft:#FBE1DF;
    --warn:#9A6300; --warn-soft:#FCEBCB;
    --chip-bg:#EFEFF2; --shadow:0 1px 2px rgba(20,21,26,.05),0 6px 18px rgba(20,21,26,.07);
    --font-d:'Manrope',system-ui,sans-serif; --font-b:'IBM Plex Sans',system-ui,sans-serif;
    --nav-h:72px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#17181C; --surface:#1E2025; --surface-2:#24262C; --border:#2E3138;
      --text:#F3F3F5; --text-muted:#9CA0AA; --text-faint:#6D7078;
      --accent:#FF5A1F; --accent-ink:#17181C; --accent-soft:#3A2013;
      --success:#34D399; --success-soft:#123024;
      --danger:#FF6B60; --danger-soft:#3A1613;
      --warn:#F5A524; --warn-soft:#3A2A08;
      --chip-bg:#24262C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17181C; --surface:#1E2025; --surface-2:#24262C; --border:#2E3138;
    --text:#F3F3F5; --text-muted:#9CA0AA; --text-faint:#6D7078;
    --accent:#FF5A1F; --accent-ink:#17181C; --accent-soft:#3A2013;
    --success:#34D399; --success-soft:#123024;
    --danger:#FF6B60; --danger-soft:#3A1613;
    --warn:#F5A524; --warn-soft:#3A2A08;
    --chip-bg:#24262C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;}
  button,input,select,textarea{font-family:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  .num{font-variant-numeric:tabular-nums;}
  .px{padding-inline:16px;}
  .screen{display:none;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));min-height:100%;}
  .screen.active{display:block;}
  .eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}
  .hero{padding:20px 16px 8px;}
  .hero h1{font-size:1.6rem;font-weight:800;}
  .hero p{color:var(--text-muted);margin:4px 0 0;font-size:.9rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow);}
  .card + .card{margin-top:10px;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:10px;}
  .row.between{justify-content:space-between;}
  .row.wrap{flex-wrap:wrap;}
  .section-title{font-size:1.02rem;font-weight:700;margin:22px 0 10px;}
  .btn{border:none;border-radius:12px;padding:12px 16px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);width:100%;}
  .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost{background:transparent;color:var(--accent);padding:8px 10px;}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-sm{padding:7px 11px;font-size:.8rem;border-radius:10px;}
  .btn-block{width:100%;}
  .icon-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.sm{width:30px;height:30px;border-radius:9px;}
  .icon-btn.sm svg{width:16px;height:16px;}
  .icon-btn:disabled{opacity:.35;cursor:default;}
  .set-row input::placeholder{color:var(--text-faint);opacity:1;}
  .set-row input.target-up::placeholder{color:var(--accent);opacity:.85;}
  .prog-banner{background:var(--surface-2);color:var(--text-muted);border-radius:10px;padding:7px 10px;font-size:.78rem;font-weight:600;margin-bottom:8px;}
  .prog-banner.up{color:var(--accent);font-weight:700;}
  .chart-note{font-size:.74rem;color:var(--text-faint);margin-top:8px;line-height:1.35;}
  .today-supp{display:flex;align-items:center;gap:10px;padding:7px 10px;}
  .card + .card.today-supp{margin-top:0;}
  .supp-btn{width:34px;height:34px;flex:none;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s,border-color .12s;}
  .supp-btn svg{width:19px;height:19px;}
  .supp-btn.taken{background:var(--success);border-color:var(--success);color:#fff;}
  .collapse-head{display:flex;align-items:center;gap:8px;background:none;border:none;padding:4px 0;color:var(--text);}
  .collapse-head .count{font-size:.72rem;font-weight:700;color:var(--text-muted);background:var(--chip-bg);border-radius:999px;padding:2px 8px;}
  .collapse-head svg{width:16px;height:16px;color:var(--text-muted);transition:transform .15s;}
  .collapse-head.collapsed svg{transform:rotate(-90deg);}
  input[type=text],input[type=number],input[type=date],select,textarea{
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:.92rem;color:var(--text);width:100%;
  }
  input[type=color]{-webkit-appearance:none;appearance:none;width:38px;height:36px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);cursor:pointer;flex:none;}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:6px;}
  input[type=color]::-moz-color-swatch{border:none;border-radius:6px;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .field label{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:5px;font-weight:600;}
  .chip{background:var(--chip-bg);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:.82rem;font-weight:600;color:var(--text-muted);white-space:nowrap;}
  .chip.active{background:var(--accent-soft);color:var(--accent);border-color:transparent;}
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0;}
  .badge{font-size:.68rem;font-weight:800;letter-spacing:.03em;padding:3px 7px;border-radius:6px;text-transform:uppercase;}
  .badge-pr{background:var(--accent-soft);color:var(--accent);}
  .badge-custom{background:var(--chip-bg);color:var(--text-muted);}
  .divider{height:1px;background:var(--border);margin:10px 0;}
  .empty{text-align:center;padding:40px 20px;color:var(--text-muted);}
  .empty svg{width:40px;height:40px;opacity:.4;margin-bottom:10px;}

  /* bottom nav */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);
    display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:40;}
  .nav-btn{flex:1;min-width:0;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-faint);font-size:.62rem;font-weight:700;padding:0 2px;}
  .nav-btn svg{width:20px;height:20px;flex:none;}
  .nav-btn.active{color:var(--accent);}

  /* workout start */
  .start-card{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%, black));color:var(--accent-ink);border-radius:18px;padding:20px;box-shadow:var(--shadow);}
  .start-card h2{font-size:1.15rem;font-weight:800;}
  .start-card p{opacity:.9;font-size:.85rem;margin:4px 0 14px;}
  .start-card .btn-primary{background:var(--accent-ink);color:var(--accent);}

  /* active workout */
  .wk-header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;padding:10px 16px;border-bottom:1px solid var(--border);}
  .wk-timer{font-family:var(--font-d);font-weight:800;font-size:1.1rem;}
  .ex-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;margin:0 16px 12px;}
  .ex-block-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .ex-block-head h3{font-size:1rem;font-weight:700;}
  .ex-block-head .meta{font-size:.75rem;color:var(--text-muted);}
  .set-table{width:100%;border-collapse:collapse;}
  .set-table th{font-size:.65rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:700;padding:4px 4px;text-align:center;}
  .set-table th:first-child,.set-table td:first-child{text-align:center;width:28px;}
  .set-table td{padding:4px 3px;text-align:center;}
  .set-table{table-layout:fixed;}
  .set-table td:last-child,.set-table td:nth-child(6){padding-left:0;padding-right:0;}
  .goal-cell{font-size:.74rem;font-weight:700;white-space:nowrap;overflow:hidden;}
  .goal-up{color:var(--accent);font-variant-numeric:tabular-nums;}
  .goal-up.stacked{display:inline-block;line-height:1.15;font-size:.72rem;}
  .prev-cell .stacked{display:inline-block;line-height:1.15;font-size:.7rem;}
  .prev-cell{white-space:nowrap;overflow:hidden;text-overflow:clip;}
  .goal-hold,.goal-none{color:var(--text-faint);}
  .goal-prog{display:inline-flex;flex-direction:column;align-items:center;gap:4px;line-height:1;vertical-align:middle;}
  .goal-dots{display:inline-flex;align-items:flex-start;gap:3px;--dot-off:color-mix(in srgb, var(--text-faint) 35%, var(--surface));}
  .goal-dots i{display:block;width:7px;height:7px;border-radius:50%;background:var(--dot-off);}
  .t1 .goal-dots i.on{background:var(--accent);}
  .t2 .goal-dots i{width:6px;height:6px;}
  .t2 .goal-dots i.on,.t3 .goal-dots i.on{background:var(--text-muted);}
  .t3 .goal-dots{gap:1px;}
  .t3 .goal-dots i{width:5px;height:3px;border-radius:0 0 3px 3px;}
  .set-table td.goal-cell{padding-left:0;padding-right:0;}
  .goal-count{font-size:.6rem;font-weight:700;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .wk-sets{font-size:.85rem;color:var(--text-muted);}
  .wk-sets b{color:var(--text);font-size:1rem;}
  .wk-progress{height:3px;border-radius:2px;background:var(--surface-2);margin-top:6px;overflow:hidden;}
  .wk-progress div{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .2s;}
  .set-row.complete{background:var(--success-soft);border-radius:8px;}
  .set-row input{width:100%;text-align:center;padding:8px 2px;font-weight:600;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  .set-idx{font-weight:700;color:var(--text-muted);font-size:.85rem;}
  .set-idx.warmup{color:var(--warn);}
  .prev-cell{color:var(--text-faint);font-size:.78rem;}
  .check-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;}
  .check-btn svg{width:16px;height:16px;opacity:0;}
  .set-row.complete .check-btn{background:var(--success);border-color:var(--success);}
  .set-row.complete .check-btn svg{opacity:1;stroke:#fff;}
  .check-btn.complete{background:var(--success);border-color:var(--success);flex:none;}
  .check-btn.complete svg{opacity:1;stroke:#fff;}
  .set-del{width:24px;height:24px;border-radius:7px;border:none;background:transparent;color:var(--text-faint);display:inline-flex;align-items:center;justify-content:center;}
  .set-del svg{width:14px;height:14px;}
  .ex-add-set{width:100%;padding:9px;border-radius:10px;border:1px dashed var(--border);background:transparent;color:var(--text-muted);font-weight:700;font-size:.82rem;margin-top:6px;}

  /* stat row (duration / volume / PRs) */
  .stat-row{display:flex;background:var(--surface-2);border-radius:12px;margin-top:10px;overflow:hidden;}
  .stat-row .stat-item{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;font-size:.82rem;font-weight:700;color:var(--text);}
  .stat-row .stat-item + .stat-item{border-left:1px solid var(--border);}
  .stat-row svg{width:15px;height:15px;flex:none;color:var(--text-muted);}
  .stat-row .stat-item.prs svg{color:var(--accent);}

  /* history */
  .cal{padding:4px 16px 6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;}
  .cal-dow{font-size:.65rem;color:var(--text-faint);text-align:center;font-weight:700;}
  .cal-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.74rem;color:var(--text-muted);position:relative;}
  .cal-cell.has-workout{font-weight:800;color:var(--accent);}
  .cal-cell.today{border:1.5px solid var(--text-faint);}
  .cal-cell.picked{background:var(--surface-2);}
  .wk-card .wname{font-weight:700;font-size:.98rem;}
  .wk-card .wmeta{font-size:.78rem;color:var(--text-muted);margin-top:2px;}

  /* exercises */
  .exlist-item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);}
  .exlist-item:last-child{border-bottom:none;}
  .exlist-item .cat-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;}
  .exlist-item .exname{font-weight:600;font-size:.92rem;}
  .exlist-item .exmeta{font-size:.74rem;color:var(--text-muted);}
  .pr-stat{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center;}
  .pr-stat b{display:block;font-family:var(--font-d);font-size:1.15rem;font-weight:800;}
  .pr-stat span{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(10,10,12,.5);z-index:80;display:flex;align-items:flex-end;}
  .sheet{background:var(--surface);width:100%;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out;}
  @keyframes up{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-title{font-size:1.1rem;font-weight:800;margin-bottom:12px;}
  .sheet-search{position:sticky;top:0;background:var(--surface);padding-bottom:8px;}

  /* toast */
  #toast-region{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
  .toast{background:var(--text);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow);}

  /* chart */
  .chart-wrap{position:relative;}
  .chart-tip{position:absolute;background:var(--text);color:var(--bg);font-size:.72rem;padding:4px 7px;border-radius:6px;pointer-events:none;white-space:nowrap;font-weight:700;display:none;}
  svg text{fill:var(--text-muted);font-family:var(--font-b);}

  ::-webkit-scrollbar{display:none;}
  [hidden]{display:none!important;}
</style>

<div id="toast-region"></div>

<main id="screen-workout" class="screen active"></main>
<main id="screen-history" class="screen"></main>
<main id="screen-exercises" class="screen"></main>
<main id="screen-stack" class="screen"></main>
<main id="screen-profile" class="screen"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-action="tab" data-tab="workout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M2 10v4M22 10v4M6.5 12h11"/></svg>
    Workout
  </button>
  <button class="nav-btn" data-action="tab" data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    History
  </button>
  <button class="nav-btn" data-action="tab" data-tab="exercises">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    Exercises
  </button>
  <button class="nav-btn" data-action="tab" data-tab="stack">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><line x1="12" y1="7.5" x2="12" y2="16.5" transform="rotate(-45 12 12)"/></svg>
    Stack
  </button>
  <button class="nav-btn" data-action="tab" data-tab="profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-4 5-5.5 7.5-5.5s6 1.5 7.5 5.5"/></svg>
    Profile
  </button>
</nav>

<div id="modal-root"></div>

<script>
/* IronLog - self-contained PWA workout tracker. All data stored locally on-device (IndexedDB). */
"use strict";
/* ---------- no pinch / double-tap zoom ---------- */
(function lockZoom() {
  try {
    let m = document.querySelector('meta[name="viewport"]');
    if (!m) { m = document.createElement("meta"); m.name = "viewport"; document.head.appendChild(m); }
    m.content = "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover";
  } catch (e) { /* ignore */ }
  const stop = (e) => e.preventDefault();
  document.addEventListener("gesturestart", stop, { passive: false }); // iOS pinch
  document.addEventListener("touchmove", (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", stop, { passive: false });
})();
/* ---------- utils ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function epley1RM(w, r) { return r <= 1 ? w : w * (1 + r / 30); }
function volumeOf(sets) { return sets.filter(s => s.completed && !s.isWarmup).reduce((a, s) => a + num(s.weight) * num(s.reps), 0); }
function fmtWeight(w) { const n = Math.round(num(w) * 10) / 10; return (n % 1 === 0 ? n.toFixed(0) : n.toFixed(1)); }
function fmtDuration(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; if (h) return `${h}h ${m}m`; if (m) return `${m}m ${s}s`; return `${s}s`; }
function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return `${m}:${String(s).padStart(2, "0")}`; }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function fmtDateShort(ts) { return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" }); }
function fmtDateFull(ts) { return new Date(ts).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }); }
function fmtDateCard(ts) { const d = new Date(ts), today = startOfDay(Date.now()).getTime(), day = startOfDay(ts).getTime(); const diffDays = Math.round((today - day) / 86400000); if (diffDays === 0) return "Today"; if (diffDays === 1) return "Yesterday"; return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" }); }

/* ---------- IndexedDB layer ---------- */
const DB_NAME = "ironlogDB", DB_VERSION = 2;
const STORES = ["exercises", "routines", "workouts", "bodyweight", "settings", "activeWorkout", "supplements", "suppLog"];
let _dbp = null;
function idbOpen() {
  if (_dbp) return _dbp;
  _dbp = new Promise((resolve, reject) => {
    let req;

    // replaying the slide-up entrance animation and losing the sheet's scroll position,
    // which is what caused the screen to "jump" on every tap inside an open modal.

}

/* ---------- progressive overload (always on) ----------

   Reps that go past the top of the range carry into the next weight (5-9 range, +2:

    if (!entry) return;

   points = (weight / 2.5 - 1) * 5 + (reps - 5).  15x7 = 27;  20x9 -> 22.5x5 = +1;

  r.exercises.filter(e => !nowIds.includes(e.exerciseId)).forEach(e => changes.push(`Removed ${name(e.exerciseId)}`));

/* ---------- PR counting (rep-range ladder) ----------

   every earlier set of that exercise. 155x9 -> 160x5 is a PR; 160x4 is not (below range);

function prBestsExcluding(excludeWorkoutId, beforeTs) {
  const best = new Map();
  state.workouts.forEach(w => {
    if (w.id === excludeWorkoutId) return;
    if (beforeTs != null && w.endedAt >= beforeTs) return;
    w.exercises.forEach(e => {
      const inc = exIncrement(e.exerciseId);
      workingSets(e.sets).forEach(st => {
        if (num(st.reps) < state.settings.repLow) return;
        const sc = ladderScore(st.weight, st.reps);
        if (!best.has(e.exerciseId) || sc > best.get(e.exerciseId)) best.set(e.exerciseId, sc);

    });
  });

}
function countPRsAgainst(exercisesArr, best) {
  let count = 0; const details = [];
  exercisesArr.forEach(entry => {
    const inc = exIncrement(entry.exerciseId);
    workingSets(entry.sets).forEach(st => {
      const w = num(st.weight), r = num(st.reps);
      if (r < state.settings.repLow) return;
      const sc = ladderScore(w, r);
      if (!best.has(entry.exerciseId) || sc > best.get(entry.exerciseId)) {

  });

  const best = new Map();

    const done = entry.sets.filter(s => s.completed);

  });

/* ---------- lightweight SVG line chart ---------- */
function chartHTML(points, unit) {
  const W = 320, H = 150, PAD = { l: 8, r: 8, t: 14, b: 20 };
  const ys = points.map(p => p.y);
  let yMin = Math.min(...ys), yMax = Math.max(...ys);
  if (yMin === yMax) { yMin -= 5; yMax += 5; } else { const pad = (yMax - yMin) * 0.15; yMin -= pad; yMax += pad; }
  const xMin = points[0].x, xMax = points[points.length - 1].x;
  const xr = Math.max(1, xMax - xMin);
  const px = (x) => PAD.l + ((x - xMin) / xr) * (W - PAD.l - PAD.r);
  const py = (y) => H - PAD.b - ((y - yMin) / (yMax - yMin)) * (H - PAD.t - PAD.b);
  const path = points.map((p, i) => `${i ? "L" : "M"}${px(p.x).toFixed(1)},${py(p.y).toFixed(1)}`).join(" ");
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" preserveAspectRatio="none">
      <line x1="${PAD.l}" y1="${H - PAD.b}" x2="${W - PAD.r}" y2="${H - PAD.b}" stroke="var(--border)" stroke-width="1"/>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${points.map(p => `<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="3" fill="var(--accent)"/>`).join("")}
      <text x="${PAD.l}" y="${H - 4}" font-size="9">${fmtDateShort(xMin)}</text>
      <text x="${W - PAD.r}" y="${H - 4}" font-size="9" text-anchor="end">${fmtDateShort(xMax)}</text>
    </svg>
    <div class="chart-tip"></div>
  </div>`;
}
function initChartInteractivity(wrap, points, unit) {
  const svg = $("svg", wrap), tip = $(".chart-tip", wrap);
  if (!svg || !points.length) return;
  const W = 320, H = 150, PAD = { l: 8, r: 8, t: 14, b: 20 };
  const xMin = points[0].x, xMax = points[points.length - 1].x, xr = Math.max(1, xMax - xMin);
  const px = (x) => PAD.l + ((x - xMin) / xr) * (W - PAD.l - PAD.r);
  function handle(evt) {
    const rect = svg.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const relX = ((clientX - rect.left) / rect.width) * W;
    let nearest = points[0], nd = Infinity;
    points.forEach(p => { const d = Math.abs(px(p.x) - relX); if (d < nd) { nd = d; nearest = p; } });
    const px2 = (px(nearest.x) / W) * rect.width;
    tip.textContent = `${nearest.label != null ? nearest.label : `${fmtWeight(nearest.y)} ${unit}`} | ${fmtDateShort(nearest.x)}`;
    tip.style.display = "block";
    tip.style.left = "0px"; // measure at a neutral position so the width isn't squeezed
    // Center on the dot, then keep the whole tooltip inside the chart (measured, not guessed).
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(px2 - tw / 2, rect.width - tw)) + "px";
    tip.style.top = "0px";
  }
  svg.addEventListener("pointermove", handle);
  svg.addEventListener("pointerdown", handle);
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}

function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
ACTIONS["export-data"] = async () => {
  const payload = { exportedAt: Date.now(), app: "IronLog", version: 2, exercises: state.exercises, routines: state.routines, workouts: state.workouts, bodyweight: state.bodyweight, supplements: state.supplements, suppLog: state.suppLog, settings: state.settings };
  const json = JSON.stringify(payload, null, 2);
  const filename = `ironlog-backup-${dayStr(Date.now())}.json`; // local date, not UTC
  // 1) Android app: native "Save As" picker.
  if (window.AndroidBridge && typeof window.AndroidBridge.exportBackup === "function") {
    try {
      window.AndroidBridge.exportBackup(utf8ToBase64(json), filename);
      toast("Choose where to save your backup");
    } catch (e) { toast("Export failed"); }
    return;
  }
  // 2) Phones and tablets (iPhone Safari / home-screen app): the Share sheet.
  //    On iPhone, pick "Save to Files". This must run before any `await`, because
  //    iOS only allows navigator.share() straight after a tap.
  if (prefersShareSheet()) {
    let file = null;
    try { file = new File([json], filename, { type: "application/json" }); } catch (e) { file = null; }
    if (file && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] }); // files only: adding text/title makes iOS save extra items
        toast("Backup exported - check it's in Files");
        return;
      } catch (e) {
        if (e && e.name === "AbortError") { toast("Backup cancelled"); return; }
        // Any other error: fall through to the other methods below.
      }
    }
  }
  // 3) Hosted as a Claude artifact: its downloads capability.
  if (window.claude && typeof window.claude.use === "function") {
    try {
      const downloads = await window.claude.use("downloads");
      if (downloads) { await downloads.save({ filename, data: json }); toast("Backup saved"); return; }
    } catch (e) { /* fall through to a normal download */ }
  }
  // 4) Any normal browser (desktop Chrome/Edge/Firefox, Safari on Mac): a regular file download.
  try {
    downloadTextFile(json, filename, "application/json");
    toast("Backup downloaded");
  } catch (e) { toast("Export failed"); }
};
function prefersShareSheet() {
  if (!navigator.share || !navigator.canShare || typeof File !== "function") return false;
  // Touch-first devices get the share sheet; desktops get a normal download.
  return !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
}
function downloadTextFile(text, filename, mime) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.rel = "noopener"; a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
function handleImportFile(e) {

    let data; try { data = JSON.parse(reader.result); } catch (err) { toast("That file isn't valid JSON"); return; }
    // Only replace the sections the file actually contains. Older backups have no Stack
    // data, so importing one must leave the current Stack alone instead of wiping it.
    const sections = ["exercises", "routines", "workouts", "bodyweight", "supplements", "suppLog"].filter(k => Array.isArray(data[k]));
    const keeps = !sections.includes("supplements") ? " Your Stack isn't in this file, so it will be kept as-is." : "";
    confirmModal("Import backup?", `This replaces your ${sections.join(", ")}${data.settings ? " and settings" : ""} with the contents of the file.${keeps}`, "Import & Replace", async () => {
      for (const k of sections) {
        await idbClear(k);
        for (const item of data[k]) await idbPut(k, item);
      }
      if (data.settings) await idbPut("settings", { ...data.settings, id: "app" });
      await boot();
      toast("Backup imported");
    }, true);
  };
  reader.readAsText(file);

}

ACTIONS["supp-dose-remove"] = (el) => {
  const idx = +el.dataset.idx;
  if (!suppDraft.doses || suppDraft.doses.length <= 1) return;
  suppDraft.doses.splice(idx, 1);
  openModal(suppModalHTML());
};
ACTIONS["supp-sched"] = (el) => { suppDraft.schedType = el.dataset.type; openModal(suppModalHTML()); };
ACTIONS["supp-day"] = (el) => {
  const d = +el.dataset.day; suppDraft.days = suppDraft.days || [];
  const idx = suppDraft.days.indexOf(d);
  if (idx >= 0) suppDraft.days.splice(idx, 1); else suppDraft.days.push(d);
  openModal(suppModalHTML());
};
ACTIONS["supp-time"] = (el) => {
  const t = el.dataset.t; suppDraft.times = suppDraft.times || [];
  const idx = suppDraft.times.indexOf(t);
  if (idx >= 0) suppDraft.times.splice(idx, 1); else suppDraft.times.push(t);
  openModal(suppModalHTML());
};
ACTIONS["save-supp"] = async () => {
  if (!suppDraft.name.trim()) { toast("Name it first"); return; }
  if (!(suppDraft.times || []).length) { toast("Pick at least one time of day"); return; }
  if (suppDraft.schedType === "days" && !(suppDraft.days || []).length) { toast("Pick at least one day"); return; }
  if (suppDraft.category === "Other" && !(suppDraft.categoryOther || "").trim()) { toast("Name the \"Other\" category"); return; }
  suppDraft.doses = (suppDraft.doses && suppDraft.doses.length) ? suppDraft.doses : [{ id: uid(), startDate: suppDraft.startDate, dose: "" }];
  suppDraft.doses[0].startDate = suppDraft.startDate;
  suppDraft.doses.sort((a, b) => (a.startDate || 0) - (b.startDate || 0));
  delete suppDraft.dose;
  await idbPut("supplements", suppDraft);
  const idx = state.supplements.findIndex(s => s.id === suppDraft.id);
  if (idx >= 0) state.supplements[idx] = suppDraft; else state.supplements.push(suppDraft);
  closeModal(); renderStackTab(); toast("Saved");
};
ACTIONS["delete-supp"] = () => {
  confirmModal("Remove from stack?", `"${suppDraft.name}" and its schedule will be deleted.`, "Delete", async () => {
    await idbDelete("supplements", suppDraft.id);
    state.supplements = state.supplements.filter(s => s.id !== suppDraft.id);
    closeModal(); renderStackTab();
  }, true);
};
/*__END__*/
</script>
